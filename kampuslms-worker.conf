# ==============================================================================
# Konfigurasi Supervisor untuk Queue Worker KampusLMS (Laravel 12)
# File ini disimpan di: /etc/supervisor/conf.d/kampuslms-worker.conf
# ==============================================================================

[program:kampuslms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kampuslms/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/kampuslms/storage/logs/worker.log
stopwaitsecs=3600

# Keterangan Parameter:
# - process_name: Penamaan proses worker dengan format 2 digit (kampuslms-worker_00, 01, dst.)
# - command: Perintah worker yang dijalankan; --sleep=3 (menunggu jika queue kosong),
#   --tries=3 (maksimal coba 3 kali sebelum masuk failed_jobs), --max-time=3600 (restart setiap 1 jam untuk cegah memory leak)
# - autostart=true: Otomatis berjalan saat sistem/server boot
# - autorestart=true: Otomatis dihidupkan kembali jika worker mengalami crash / mati tak terduga
# - numprocs=2: Menjalankan 2 worker paralel agar antrean dapat diproses secara bersamaan
# - stopwaitsecs=3600: Memberikan waktu toleransi bagi worker untuk menyelesaikan tugas sebelum di-kill paksa

